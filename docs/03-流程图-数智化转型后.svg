⑤ AI 硬约束校验 + 兜底</text><text x="404.0" y="508.0" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12" font-weight="400" fill="#5B6472">效期 / 上限 / 权限 / 重复 / 新鲜度 / 兜底触发阻断</text><polygon points="404.0,536 448.0,580 404.0,624 360.0,580" fill="#E8F5EC" stroke="#3C8A5A" stroke-width="1.8"/><text x="404.0" y="576.5" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#173C2A">高置信</text><text x="404.0" y="593.5" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#173C2A">且无异常？</text><line x1="404.0" y1="600" x2="404.0" y2="536" stroke="#5B8AC0" stroke-width="1.8"/><polygon points="404.0,536 407.5,542.062177826491 400.5,542.062177826491" fill="#5B8AC0"/><rect x="64.0" y="690" width="280.0" height="72" rx="12" fill="#E8F5EC" stroke="#3C8A5A" stroke-width="1.8"/><rect x="64.0" y="690" width="6" height="72" rx="3" fill="#3C8A5A"/><text x="204.0" y="722.0" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15.5" font-weight="700" fill="#173C2A">⑥ 批量流转</text><text x="204.0" y="742.0" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12" font-weight="400" fill="#5B6472">高置信单直接流转</text><rect x="464.0" y="690" width="280.0" height="72" rx="12" fill="#FDF1E1" stroke="#D98A1F" stroke-width="1.8"/><rect x="464.0" y="690" width="6" height="72" rx="3" fill="#D98A1F"/><text x="604.0" y="722.0" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15.5" font-weight="700" fill="#5A3E12">⑥ 例外复核</text><text x="604.0" y="742.0" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12" font-weight="400" fill="#5B6472">medium/low 置信，改量必填理由</text><line x1="376.0" y1="608" x2="174.0" y2="690" stroke="#3C8