ng SC, Noto Sans SC, sans-serif" font-size="11" font-weight="400" fill="#5B6472">不在改动范围</text><rect x="1316.6666666666667" y="120" width="255.33333333333334" height="340" rx="10" fill="#FFFFFF" stroke="#D5DCE6" stroke-width="1.4"/><rect x="1316.6666666666667" y="120" width="255.33333333333334" height="34" rx="10" fill="#1F4788"/><rect x="1316.6666666666667" y="144" width="255.33333333333334" height="10" fill="#1F4788"/><text x="1444.3333333333335" y="143" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">量化渗透口径</text><text x="1334.6666666666667" y="183" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#1F2937">缺货率</text><text x="1334.6666666666667" y="200" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11" font-weight="400" fill="#5B6472">12% → 5% 以下</text><text x="1334.6666666666667" y="241" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#1F2937">库存周转</text><text x="1334.6666666666667" y="258" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11" font-weight="400" fill="#5B6472">48 天 → 35 天</text><text x="1334.6666666666667" y="299" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#1F2937">账实差异</text><text x="1334.6666666666667" y="316" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11" font-weight="400" fill="#5B6472">可解释率提升</text><text x="1334.6666666666667" y="357" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#1F2937">报废</text><text x="1334.6666666666667" y="374" text-anchor="start" font-family="Microsoft Y