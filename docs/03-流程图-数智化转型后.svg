可见到货</text><text x="404.0" y="910.0" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12" font-weight="400" fill="#5B6472">DC 不足→5 因子评分调拨（区域物流审批）；门店看到预计到货与未满足数量</text><line x1="404.0" y1="846" x2="404.0" y2="858" stroke="#5B8AC0" stroke-width="1.8"/><polygon points="404.0,858 400.5,851.937822173509 407.5,851.937822173509" fill="#5B8AC0"/><rect x="124.0" y="942" width="560" height="72" rx="12" fill="#F2EFFB" stroke="#5B4B8A" stroke-width="1.8"/><rect x="124.0" y="942" width="6" height="72" rx="3" fill="#5B4B8A"/><text x="404.0" y="974.0" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15.5" font-weight="700" fill="#2A2450">⑨ 扫码收货 + 审计可重建</text><text x="404.0" y="994.0" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12" font-weight="400" fill="#5B6472">差异自动开异常单；兜底 + 审计日志保留版本/建议/修正/签核人</text><line x1="404.0" y1="930" x2="404.0" y2="942" stroke="#5B8AC0" stroke-width="1.8"/><polygon points="404.0,942 400.5,935.937822173509 407.5,935.937822173509" fill="#5B8AC0"/><rect x="124.0" y="1026" width="560" height="72" rx="12" fill="#F2EFFB" stroke="#5B4B8A" stroke-width="1.8"/><rect x="124.0" y="1026" width="6" height="72" rx="3" fill="#5B4B8A"/><text x="404.0" y="1058.0" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15.5" font-weight="700" fill="#2A2450">⑩ 指标看板</text><text x="404.0" y="1078.0" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12" font-weight="400" fill="#5B6472">缺货率 / 周转 / 报废并列，促销期单列误差，口径唯一</text><line x1="404.0" y1="1014" x2="404.0" y2="1026" stroke="#8A97A8" stroke-width="1.8"/><polygon points="404.0,1026 400.5,1019.937822173509 407.5,1019.937822173509" fill="#8A97A8"/><rect x="774" y="120" width="255.33333333333334" height="340" rx="10" fill="#FFFFFF" stroke="#D5DCE6" stroke-width="1.4"/><rect x="