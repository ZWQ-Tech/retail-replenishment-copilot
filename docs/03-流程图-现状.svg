ht="700" fill="#1F2937">缺货率</text><text x="1334.6666666666667" y="204" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11" font-weight="400" fill="#5B6472">12%（目标 5% 以下）</text><text x="1334.6666666666667" y="245" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#1F2937">库存周转</text><text x="1334.6666666666667" y="262" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11" font-weight="400" fill="#5B6472">48 天（目标 35 天）</text><text x="1334.6666666666667" y="303" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#1F2937">账实差异</text><text x="1334.6666666666667" y="320" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11" font-weight="400" fill="#5B6472">平均 8%</text><text x="1334.6666666666667" y="361" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#1F2937">延迟补货</text><text x="1334.6666666666667" y="378" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11" font-weight="400" fill="#5B6472">约 30% 源于配送排队</text><rect x="124.0" y="913" width="14" height="14" rx="3" fill="#FBEBEA"/><text x="144.0" y="924" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12" font-weight="400" fill="#5B6472">人工/高风险</text><rect x="250.0" y="913" width="14" height="14" rx="3" fill="#FDF1E1"/><text x="270.0" y="924" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12" font-weight="400" fill="#5B6472">人工负责</text><rect x="350.0" y="913" width="14" height="14" rx="3" fill="#EAF1FB"/><text x="370.0" y="924" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12" font-weight="400" fill="#5B6472">普通步骤</text><rect x="0" y="947" width="1600" height="64" fill="#16325C"/><text x="800.0" y="985.0" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">现状业务变化：口径不一致（账实差 8%）+ 缺货截断误读 + 约束缺失，缺货与积压并存</text>
